<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA / 홈화면 추가 관련 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes"> <!-- ✅ deprecated 경고 해결 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="bookat!">

  <title>bookat!</title>

  <!-- (선택) favicon 404 방지: 아이콘 파일 없으면 data URL로라도 지정 -->
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <!-- Tailwind CDN: config보다 먼저 와야 함 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind config: ✅ 1번만 선언 (중복 제거) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: '#00A19B',
            ceeded: '#CEEDD0',
            lavender: '#E5DADE',
            achromatic: {
              50: '#F9F9F9',
              100: '#F2F2F2',
              200: '#E5E5E5',
              300: '#D4D4D4',
              400: '#A3A3A3',
              500: '#737373',
              600: '#525252',
              700: '#404040',
              800: '#262626',
              900: '#171717',
            }
          }
        }
      }
    };
  </script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
            color: #404040;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .writing-vertical {
            writing-mode: vertical-rl;
        }
        .index-tab-active {
            background-color: #FFFFFF;
            color: #00A19B;
            border-top: 2px solid #00A19B;
        }
        .index-tab-inactive {
            background-color: #F2F2F2;
            color: #A3A3A3;
            border-top: 2px solid transparent;
        }
        /* iPhone transition effect */
        @keyframes slideUp {
          from { transform: translateY(100%); }
          to { transform: translateY(0); }
        }
        .animate-slide-up {
          animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
</head>
<body class="overflow-hidden">
    <div id="root" class="h-screen flex flex-col"></div>
</body>
</html>
